services:
  - type: web
    name: node-sentinel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: REQUIRE_AUTH
        value: "true"
      - key: ALLOW_EPHEMERAL_AUTH_STORAGE
        value: "true"
      - key: USERS_FILE
        value: /app/data/users.json
      - key: AUDIT_FILE
        value: /app/data/audit_log.json
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://node-sentinel.onrender.com
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "600"
      - key: OCR_ENABLED
        value: "true"
      - key: TESSERACT_CMD
        value: "/usr/bin/tesseract"
